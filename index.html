<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="ts.css">
    <title>Login Page</title>  
</head>
<body>
    <!-- Background -->
    <div class="background">
        <!-- Navbar -->
        <header class="navbar">
            <div class="logo">
                Logo
            </div>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
                <a href="#" class="login-btn">
                    Login
                </a>
            </nav>
        </header>
        <!-- Login Form -->
        <div class="login-box">
            <h2>Login</h2>
            <form>
                <!-- Email -->
                <div class="input-box">
                    <label>Email</label>
                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>
                </div>
                <!-- Password -->
                <div class="input-box">
                    <label>Password</label>
                    <input
                        type="password"
                        placeholder="Enter your password"
                        required>
                </div>
                <!-- Remember -->
                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">
                        Forgot Password?
                    </a>
                </div>
                <!-- Login -->
                <button
                    type="submit"
                    class="submit-btn">
                    Login
                </button>
                <!-- Register -->
                <p class="register">
                    Don't have an account?
                    <a href="#">
                        Register
                    </a>
                </p>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
